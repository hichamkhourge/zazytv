version: '3.8'

services:
  zazy-automation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zazy-automation
    restart: unless-stopped
    ports:
      - "8899:8899"
    environment:
      # 2captcha Configuration
      - TWOCAPTCHA_API_KEY=${TWOCAPTCHA_API_KEY}

      # Automation API Key (shared with iptvProvider)
      - AUTOMATION_API_KEY=${AUTOMATION_API_KEY}

      # URLs
      - BASE_URL=${BASE_URL:-https://zazyhost.com}
      - HOME_URL=${HOME_URL:-https://zazytv.com/}

      # Login Credentials (optional)
      - LOGIN_EMAIL=${LOGIN_EMAIL:-your@email.com}
      - LOGIN_PASSWORD=${LOGIN_PASSWORD:-yourpassword}
      - SKIP_LOGIN=${SKIP_LOGIN:-True}

      # Promo Code
      - PROMO_CODE=${PROMO_CODE:-}

      # IBO Player Configuration
      - IBOPLAYER_COOKIE=${IBOPLAYER_COOKIE}
      - IBOPLAYER_PLAYLIST_URL_ID=${IBOPLAYER_PLAYLIST_URL_ID}
      - IBOPLAYER_PLAYLIST_NAME=${IBOPLAYER_PLAYLIST_NAME:-Zazy}
      - IBOPLAYER_PLAYLIST_URL=${IBOPLAYER_PLAYLIST_URL:-http://live.zazytv.com}
      # IBO Player device login (bearer-token auth used by uzeen_playlist_updater, viewtvy and tvcorn)
      - IBOPLAYER_MAC_ADDRESS=${IBOPLAYER_MAC_ADDRESS}
      - IBOPLAYER_DEVICE_KEY=${IBOPLAYER_DEVICE_KEY}

      # Telegram Notifications & Bot
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_BOT_POLL_INTERVAL=${TELEGRAM_BOT_POLL_INTERVAL:-1.0}
      - TELEGRAM_BOT_TIMEOUT=${TELEGRAM_BOT_TIMEOUT:-30}

      # UGEEN Scraper Configuration
      - UGEEN_EMAIL=${UGEEN_EMAIL}
      - UGEEN_PASSWORD=${UGEEN_PASSWORD}
      - UGEEN_URL=${UGEEN_URL:-http://ugeen.live}
      - UGEEN_PACKAGE_ID=${UGEEN_PACKAGE_ID:-384}
      - UGEEN_HEADLESS=${UGEEN_HEADLESS:-True}
      - UGEEN_SESSION_DIR=${UGEEN_SESSION_DIR:-./ugeen_sessions}
      - UGEEN_DATA_DIR=${UGEEN_DATA_DIR:-./ugeen_data}

      # Timezone for cron
      - TZ=${TZ:-UTC}

      # IPTVV Canada diagnostics / egress preflight
      - IPTVV_DEBUG_DIR=${IPTVV_DEBUG_DIR:-/app/logs}
      - IPTVV_PROXY_CHECK_URL=${IPTVV_PROXY_CHECK_URL:-https://api.ipify.org}
      - IPTVV_KNOWN_BLOCKED_IP=${IPTVV_KNOWN_BLOCKED_IP:-}
      - IPTVV_CLOUDFLARE_WAIT_SECONDS=${IPTVV_CLOUDFLARE_WAIT_SECONDS:-45}
      - IPTVV_PAGE_LOAD_RETRIES=${IPTVV_PAGE_LOAD_RETRIES:-2}
      # Automation runs on the host's public IP with a direct connection (no proxy).

    volumes:
      # Persistent storage for playlists
      - zazy-playlists:/app/playlists

      # UGEEN data directories
      - ugeen-sessions:/app/ugeen_sessions
      - ugeen-data:/app/ugeen_data

      # Mount .env file (alternative to env_file)
      - ./.env:/app/.env:ro

      # Optional: Mount logs
      - zazy-logs:/var/log
      - zazy-logs:/app/logs

    networks:
      - zazy-network
      - dokploy-network

    # Health check
    healthcheck:
      test: ["CMD", "test", "-f", "/var/run/crond.pid"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  zazy-playlists:
    driver: local
  ugeen-sessions:
    driver: local
  ugeen-data:
    driver: local
  zazy-logs:
    driver: local

networks:
  zazy-network:
    driver: bridge
  dokploy-network:
    external: true
